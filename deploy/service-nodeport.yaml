# 可选：无 Ingress / LoadBalancer 时暴露控制台（NodePort）
apiVersion: v1
kind: Service
metadata:
  name: labplane-nodeport
  namespace: labplane
  labels:
    app.kubernetes.io/name: labplane
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: labplane
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 32080
      protocol: TCP
