# 通用模板（namespace labplane）：
#   kubectl apply -f deploy/labplane-all.yaml
# GitHub Release 附带的同名清单会自动使用当前仓库实际发布的 GHCR 镜像，推荐优先使用。
#
# 若私有仓库需登录拉取镜像，先创建 pull secret 再编辑 Deployment 增加 imagePullSecrets：
#   kubectl create secret docker-registry my-registry-secret \
#     --docker-server=your-registry.example.com --docker-username=你的用户 --docker-password=你的密码 \
#     -n labplane
#   kubectl -n labplane patch deploy labplane --type=json \
#     -p='[{"op":"add","path":"/spec/template/spec/imagePullSecrets","value":[{"name":"my-registry-secret"}]}]'
#
# 访问：浏览器打开 http://<任意节点IP>:32080/setup 完成向导（需集群内可连的 MySQL / Redis）。
# 若 PVC 一直处于 Pending，在下方 PVC 中取消注释并填写集群的 storageClassName。
---
apiVersion: v1
kind: Namespace
metadata:
  name: labplane
  labels:
    app.kubernetes.io/name: labplane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: labplane
  namespace: labplane
  labels:
    app.kubernetes.io/name: labplane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: labplane
  labels:
    app.kubernetes.io/name: labplane
# 安全提示：本角色为功能完整而较宽（全命名空间 Secret 只读、Pod exec、全资源只读兜底）。
# 生产环境收窄方法见 deploy/rbac.yaml 头部注释（Role+RoleBinding 限定 Secret 命名空间等）。
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Gateway API 路由管理面板；集群未安装对应 CRD 时规则不生效，无副作用
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses", "gateways", "httproutes", "grpcroutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: labplane
  labels:
    app.kubernetes.io/name: labplane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: labplane
subjects:
  - kind: ServiceAccount
    name: labplane
    namespace: labplane
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: labplane-data
  namespace: labplane
  labels:
    app.kubernetes.io/name: labplane
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # 集群无默认 StorageClass 时取消下一行注释并填写，例如：local-path、nfs-client、rook-ceph-block
  # storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: labplane
  namespace: labplane
  labels:
    app.kubernetes.io/name: labplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: labplane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: labplane
    spec:
      serviceAccountName: labplane
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # 私有 Registry 拉取镜像时取消注释（需先创建同名 secret，见文件头说明）
      # imagePullSecrets:
      #   - name: my-registry-secret
      containers:
        - name: labplane
          image: ghcr.io/abcdocker/labplane:v2.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LABPLANE_DATA_DIR
              value: "/data"
          # Optional: create labplane-secrets before or after applying this manifest.
          envFrom:
            - secretRef:
                name: labplane-secrets
                optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: labplane-data
---
apiVersion: v1
kind: Service
metadata:
  name: labplane
  namespace: labplane
  labels:
    app.kubernetes.io/name: labplane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: labplane
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: labplane-nodeport
  namespace: labplane
  labels:
    app.kubernetes.io/name: labplane
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: labplane
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 32080
      protocol: TCP
