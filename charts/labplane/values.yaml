app:
  replicaCount: 1
  performance:
    # 与 resources.limits.cpu 整核一致，如 "2"；留空则不设置
    goMaxProcs: ""
    enableBackgroundJobs: true
    performanceMode: false
  image:
    repository: ghcr.io/abcdocker/labplane
    tag: v2.0.0
    pullPolicy: IfNotPresent
    # 私有仓库拉取密钥（可选）
    pullSecret: ""
  # 敏感变量统一从已有 Secret 注入；Secret key 使用 BAOTA_API_KEY、DASHBOARD_PASSWORD 等环境变量名。
  existingSecret: ""
  service:
    type: ClusterIP
    port: 8080
    nodePort: 31080
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "512Mi"

# 持久化存储
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 5Gi
  # 若使用已有 PVC，填写名称并禁用自动创建
  existingClaim: ""
  # 集群 StorageClass，空则使用默认
  storageClass: ""

rbac:
  # 开启后允许平台写入任意 CRD 实例；权限范围很大，仅在确实使用动态 CRD 管理时开启。
  allowCustomResourceMutations: false
  # 全命名空间 Secret 只读（ConfigMap/Secret 浏览页需要）。生产环境建议关闭；
  # 需按命名空间放开时，请另行创建 Role + RoleBinding 绑定平台 ServiceAccount。
  allowClusterSecretRead: true
  # 全集群所有资源只读（动态 CRD 面板兜底浏览）。只管理已知资源类型时可关闭。
  readAllClusterResources: true

# 安全与环境配置
config:
  # 宝塔面板配置（可选，也可通过 Web /setup 配置）
  baotaUrl: ""
  # 家庭宽带 DDNS 配置
  ddnsHost: "home.example.com"
  defaultPort: "38333"
  httpsPort: "38443"
  # Web 登录（可选）
  authUser: ""

# ==========================================
# 📦 底层依赖开关 (一键安装前置组件)
# ==========================================
ingress-nginx:
  enabled: false
  controller:
    hostNetwork: true
    kind: DaemonSet
    image:
      registry: registry.aliyuncs.com
      image: google_containers/nginx-ingress-controller
    admissionWebhooks:
      patch:
        image:
          registry: registry.aliyuncs.com
          image: google_containers/kube-webhook-certgen

metallb:
  enabled: false
  controller:
    image:
      registry: quay.m.daocloud.io
  speaker:
    image:
      registry: quay.m.daocloud.io
